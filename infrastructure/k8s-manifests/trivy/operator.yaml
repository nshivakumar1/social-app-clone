# Trivy Operator — scans all workloads, stores results as K8s CRDs (VulnerabilityReport, ConfigAuditReport, etc.)
# Full CRD + RBAC manifests: kubectl apply -f https://raw.githubusercontent.com/aquasecurity/trivy-operator/v0.22.0/deploy/static/trivy-operator.yaml
# This file covers the ConfigMap + Deployment overrides for EKS

apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-operator
  namespace: trivy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator
rules:
- apiGroups: [""]
  resources: [pods, pods/log, replicationcontrollers, resourcequotas, limitranges, serviceaccounts, services, configmaps, namespaces, nodes]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, daemonsets, replicasets, statefulsets]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch, create, delete]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles, rolebindings, clusterroles, clusterrolebindings]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies, ingresses]
  verbs: [get, list, watch]
- apiGroups: [policy]
  resources: [podsecuritypolicies]
  verbs: [get, list, watch]
- apiGroups: [aquasecurity.github.io]
  resources:
  - vulnerabilityreports
  - configauditreports
  - clustercompliancereports
  - clusterconfigauditreports
  - exposedsecretreports
  - rbacassessmentreports
  - infraassessmentreports
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-operator
subjects:
- kind: ServiceAccount
  name: trivy-operator
  namespace: trivy-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator
  namespace: trivy-system
data:
  OPERATOR_NAMESPACE: trivy-system
  OPERATOR_TARGET_NAMESPACES: ""         # empty = all namespaces
  OPERATOR_EXCLUDE_NAMESPACES: kube-system,kube-public
  OPERATOR_SERVICE_ACCOUNT: trivy-operator
  OPERATOR_LOG_DEV_MODE: "false"
  OPERATOR_SCAN_JOB_TIMEOUT: 5m
  OPERATOR_CONCURRENT_SCAN_JOBS_LIMIT: "10"
  OPERATOR_SCAN_JOB_RETRY_AFTER: 30s
  OPERATOR_BATCH_DELETE_LIMIT: "10"
  OPERATOR_BATCH_DELETE_DELAY: 10s
  OPERATOR_METRICS_BIND_ADDRESS: :8080
  OPERATOR_HEALTH_PROBE_BIND_ADDRESS: :9090
  OPERATOR_VULNERABILITY_SCANNER_ENABLED: "true"
  OPERATOR_CONFIG_AUDIT_SCANNER_ENABLED: "true"
  OPERATOR_EXPOSED_SECRET_SCANNER_ENABLED: "true"
  OPERATOR_RBAC_ASSESSMENT_SCANNER_ENABLED: "true"
  OPERATOR_INFRA_ASSESSMENT_SCANNER_ENABLED: "true"
  OPERATOR_VULNERABILITY_SCANNER_SCAN_ONLY_CURRENT_REVISIONS: "false"
  TRIVY_SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  TRIVY_IMAGE_REPOSITORY: ghcr.io/aquasecurity/trivy
  TRIVY_MODE: Standalone
  TRIVY_TIMEOUT: 5m0s
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy-operator
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trivy-operator
    spec:
      serviceAccountName: trivy-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
      containers:
      - name: trivy-operator
        image: ghcr.io/aquasecurity/trivy-operator:0.22.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: trivy-operator
        ports:
        - name: metrics
          containerPort: 8080
        - name: probes
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
