# Promtail as a ConfigMap — used as a sidecar in the app deployment
# EKS Fargate doesn't support DaemonSets, so Promtail runs as a sidecar
# alongside the app container to ship logs → Loki

apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: default
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
        tenant_id: social-app

    scrape_configs:
      - job_name: social-app
        static_configs:
          - targets: [localhost]
            labels:
              job: social-app-clone
              app: social-app-clone
              namespace: default
              __path__: /var/log/app/*.log

      - job_name: social-app-stdout
        pipeline_stages:
          - json:
              expressions:
                level: level
                message: message
                timestamp: timestamp
                method: method
                path: path
                statusCode: statusCode
                responseTime: responseTime
          - labels:
              level:
              method:
              path:
          - timestamp:
              source: timestamp
              format: RFC3339
        static_configs:
          - targets: [localhost]
            labels:
              job: social-app-stdout
              app: social-app-clone
              __path__: /proc/1/fd/1
