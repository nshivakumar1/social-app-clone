apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: loki
              matcherRegex: '"requestId":"([^"]+)"'
              name: RequestID
              url: '${__value.raw}'

      - name: CloudWatch
        type: cloudwatch
        uid: cloudwatch
        access: proxy
        isDefault: true
        jsonData:
          authType: default         # uses EKS pod IAM / node role
          defaultRegion: us-east-1
          customMetricsNamespaces: SocialApp/Monitoring
